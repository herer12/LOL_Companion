name: Fehler melden
description: Einen reproduzierbaren Fehler beschreiben
labels: [bug]
body:
  - type: textarea
    id: summary
    attributes:
      label: Beschreibung
      description: Was ist passiert?
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: Schritte zum Reproduzieren
      description: Welche Schritte führen zum Fehler?
      placeholder: |
        1. ...
        2. ...
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Erwartetes Verhalten
    validations:
      required: true
  - type: textarea
    id: environment
    attributes:
      label: Umgebung
      description: Betriebssystem, App-Version und relevante Details
    validations:
      required: false
